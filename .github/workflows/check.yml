name: check

# One gate: the same `make check` you run locally. Deployment lives in its own
# workflow, added when the project has something to deploy.
#
# `kit audit --strict` deliberately does not run here. It would mean installing
# the kit, which is a private module, which means a credential in every project
# scaffolded from this template — one more secret to store and rotate in each
# repo, and a first push that fails until someone sets it. Drift is cheap to
# catch locally, where `kit next` is already being run; it is not worth that.
# If the kit ever goes public, adding the two steps back costs nothing.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    # The gate is minutes; the runner's own limit is six hours. A hung test — one waiting on
    # a server CI does not have — should fail while somebody is still looking at the push.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # CI is where the gate is absolute: `make check` skips shellcheck loudly when it is
      # absent, and here it never is. The linter is not installed here at all — `make lint`
      # fetches it at the version the Makefile names, which is the one place that names it,
      # so this workflow and a laptop cannot run different versions.
      - run: sudo apt-get install -y --no-install-recommends shellcheck

      - run: make check
